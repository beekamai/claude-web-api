[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-web-api"
version = "3.1.0"
description = "Local OpenAI- and Anthropic-compatible bridge to authorised model web sessions"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "beekamai" }]
dependencies = [
    "camoufox[geoip]>=0.4.11",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
]

[project.scripts]
claude-web-api = "claude_web_api.app:main"

[project.urls]
Homepage = "https://github.com/beekamai/claude-web-api"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_web_api"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# The control panel and its strings are Russian by design, so the ambiguous
# unicode rules (RUF001-003) would only produce noise.
select = ["E", "F", "W", "I", "B", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E501"]
# Both modules embed browser-side JavaScript verbatim; reflowing those
# literals would change the code that actually runs in the page.
"src/claude_web_api/session/claude.py" = ["E501"]
"src/claude_web_api/enrollment/manager.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
